name: Sao lưu cơ sở dữ liệu

# Supabase gói miễn phí không có bản sao lưu nào, nên đây là lớp bảo vệ duy
# nhất cho sổ sách của spa. Chạy trên GitHub Actions vì pg_dump là chương
# trình nhị phân, Cloudflare Workers không chạy được.

on:
  schedule:
    # 19:00 UTC = 02:00 giờ Việt Nam — lúc spa đã đóng cửa
    - cron: '0 19 * * *'
  workflow_dispatch: # cho phép chạy tay khi cần

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Một bản sao lưu chưa từng thử khôi phục thì chưa phải bản sao lưu.
    # Dựng sẵn một Postgres trống để nạp lại bản vừa tạo ngay trong cùng lượt chạy.
    services:
      verify:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: verify
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v4

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Phiên bản pg_dump phải bằng hoặc mới hơn máy chủ, nếu không sẽ từ chối chạy
      - name: Cài PostgreSQL client 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Ubuntu có sẵn pg_dump 16 đứng trước trong PATH; pg_dump từ chối chạy
          # khi máy chủ mới hơn chính nó, nên phải trỏ thẳng vào bản 17.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      # Dùng `npm install` chứ không phải `npm ci`: lock file sinh trên macOS
      # thiếu vài optional dependency chỉ có ở Linux (@emnapi/*), khiến `npm ci`
      # từ chối chạy. Job này chạy một lần mỗi ngày nên chậm thêm vài chục giây
      # không đáng kể, đổi lại không bị tắc vì khác biệt nền tảng.
      - run: npm install --no-audit --no-fund

      # ── Quyền ghi lên Drive ──────────────────────────────────────────────
      # Job này KHÔNG còn giữ refresh token của Drive. Nó gọi
      # `/api/cron/drive-token` bằng `CRON_SECRET` để xin một access token sống
      # ~1 giờ, dùng xong là hết.
      #
      # Vì sao đổi: bản cũ giữ secret riêng `GOOGLE_REFRESH_TOKEN`, tức có HAI
      # kết nối Drive song song, cấp cùng ngày và hết hạn cùng ngày, mà chỉ một
      # cái có nút bấm để sửa. Ngày 12/09 anh Khôi bấm "Kết nối lại"; ứng dụng
      # sống lại còn secret ở đây thì không, và 04:05 hôm sau sao lưu đổ. Giờ
      # chỉ còn một kết nối, bấm một lần là cả hai cùng sống.
      #
      # Vẫn cố ý KHÔNG đưa ENCRYPTION_KEY lên đây: khoá đó mở được mọi dữ liệu
      # nhạy cảm đã mã hoá, không riêng token Drive.
      - name: Chạy sao lưu
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_TOKEN_URL: ${{ secrets.APP_URL }}/api/cron/drive-token
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKUP_RETENTION_DAYS: '30'
        run: npx tsx scripts/backup.ts

      - name: Khôi phục thử bản vừa tạo
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_TOKEN_URL: ${{ secrets.APP_URL }}/api/cron/drive-token
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERIFY_URL: postgresql://postgres:verify@localhost:5433/verify
        run: npx tsx scripts/verify-backup.ts

      - name: Báo khi thất bại
        if: failure()
        run: |
          echo "::error::Sao lưu thất bại. Nếu log nói không xin được token Drive thì vào https://kios-xm.spa-xumay.workers.dev/admin/settings/storage bấm 'Kết nối lại' — token của Google hết hạn 7 ngày một lần khi app còn ở chế độ Testing (ADR-002 §2.6)."
