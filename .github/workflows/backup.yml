name: Sao lưu cơ sở dữ liệu

# Supabase gói miễn phí không có bản sao lưu nào, nên đây là lớp bảo vệ duy
# nhất cho sổ sách của spa. Chạy trên GitHub Actions vì pg_dump là chương
# trình nhị phân, Cloudflare Workers không chạy được.

on:
  schedule:
    # 19:00 UTC = 02:00 giờ Việt Nam — lúc spa đã đóng cửa
    - cron: '0 19 * * *'
  workflow_dispatch: # cho phép chạy tay khi cần

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Phiên bản pg_dump phải bằng hoặc mới hơn máy chủ, nếu không sẽ từ chối chạy
      - name: Cài PostgreSQL client 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      # Dùng `npm install` chứ không phải `npm ci`: lock file sinh trên macOS
      # thiếu vài optional dependency chỉ có ở Linux (@emnapi/*), khiến `npm ci`
      # từ chối chạy. Job này chạy một lần mỗi ngày nên chậm thêm vài chục giây
      # không đáng kể, đổi lại không bị tắc vì khác biệt nền tảng.
      - run: npm install --no-audit --no-fund

      - name: Chạy sao lưu
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Cố ý KHÔNG dùng ENCRYPTION_KEY ở đây: khoá đó mở được mọi dữ liệu
          # nhạy cảm đã mã hoá. Chỉ đưa riêng refresh token của Drive.
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BACKUP_RETENTION_DAYS: '30'
        run: npx tsx scripts/backup.ts

      - name: Báo khi thất bại
        if: failure()
        run: |
          echo "::error::Sao lưu thất bại. Kiểm tra kết nối Google Drive (token có thể đã hết hạn) và chuỗi kết nối cơ sở dữ liệu."
